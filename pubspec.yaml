name: sippt_movil
description: >-
  SIPPT — Monitoreo inteligente de la producción piscícola de trucha.
  App móvil con Firebase (Auth + Cloud Firestore en tiempo real).
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Firebase: sin versión fija para que pub elija la última compatible con tu Flutter.
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  fl_chart: ^1.0.0
  intl: any  # la versión la fija flutter_localizations

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
